name: Keep backend awake

on:
  schedule:
    # Neon free sleeps after ~5 minutes idle. Ping just before that.
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the BACKEND_URL GitHub secret to your production API, e.g. https://your-backend.vercel.app"
            exit 1
          fi
          URL="${BACKEND_URL%/}/health"
          echo "Pinging $URL"
          curl -fsS --max-time 45 "$URL"
          echo
          echo "Keep-alive ping succeeded"
